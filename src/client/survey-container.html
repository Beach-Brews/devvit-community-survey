
<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Survey Post</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body class="h-full text-neutral-content bg-[#0c1316] p-4 flex flex-col gap-10 items-center justify-center">
<div class="w-full relative overflow-hidden pointer-cursor isolate mt-xs xs:rounded-4 flex items-center justify-center">
    <div id="post-container" style="width: 340px; max-width: 340px; height: 512px; min-height: 512px; max-height: 512px; overflow: hidden" class=" box-border overflow-hidden relative shrink-0 flex flex-col p-0 items-stretch border-0 rounded-dx-sm pointer-events-none [&>:not(.pointer-events-none)]:pointer-events-auto ">
        <div style="width: 100%; height: 100%;" class="flex box-border relative shrink-0 ">
            <iframe class="border border-neutral-border-weak rounded-2xl" style="flex-grow: 1; max-width: 100%; max-height: 100%" src="survey.html"></iframe>
        </div>
    </div>
</div>
<div class="flex gap-2 items-center">
    <label for="width-control">Width:</label>
    <input id="width-control" type="number" value="340" class="px-4 py-0.5 border border-rl-border-weak dark:border-rd-border-weak rounded-sm" />
    <div>340-700</div>
</div>
<script>
    const ctl = document.getElementById('width-control');
    ctl.addEventListener('change', () => {
        let val = parseInt(ctl.value);
        if (isNaN(val) || val < 340)
            val = 340;
        if (val > 700)
            val = 700;
        const post = document.getElementById('post-container');
        post.style.width = `${val}px`;
        post.style.maxWidth = `${val}px`;
        ctl.value = val;
    });
</script>
</body>
</html>
